<script>
/* -------------------------------------------------------------------------
   WHITELISTED OBSERVERS
   Add more entries here — the page renders whatever is in this list.
     { id, handle, role?, clearance, status,
       notes: [ 'text' | { text, meta } |
                { id, date, ref, author?, tag?, body: [ 'para' | { text, meta } ] } ],
       reply: 'mainframe reply' | { author, tag, body: [ 'para' ] } }
   ------------------------------------------------------------------------- */
var OBSERVERS = [
  {
    id: 'ZD.0001', handle: 'csillustrator', role: 'Observer', clearance: 2, status: 'whitelisted',
    notes: [
      {
        id: 'ZD.0001-001',
        date: '16th Nov 2026',
        ref: 'https://www.instagram.com/p/DePC3b2jrs2/c/18639964330065325/?img_index=1',
        body: [
          'The fragments document two observers, RR26 and ZS10, studying Subject 4, Chaya, under an enigmatic organisation whose motives remain unclear. Chaya exhibits unusually strong relationships with fauna, which appear docile in her presence. She seems capable of controlling a mysterious power termed Echo, while her glowing amulet emits a strange energy, attracts animals and may guide her travels. The amulet also distorts space, though ZS10 attributes the disruption of space and time to Chaya herself. The relationship between these phenomena remains uncertain.',
          "The observers' journals reveal that their superiors consider understanding Chaya essential to their survival, yet refuse to explain why. Both express distrust towards the organisation, with RR26 explicitly warning against trusting the system.",
          "SYS fragments establish a broader cosmological framework involving the Kali Yuga, an age of spiritual decline, and corrupted projections of subsequent cycles. Recurring references to memory, forgetting and loss may relate to the deterioration of the archives themselves, potentially connected to Chaya's disruptive abilities.",
          "Particularly intriguing are the Seven Islands, whose pre-disruption coordinates correspond to Tirumala, home to Sri Venkateswara Temple. The site's seven hills traditionally represent the seven hoods of Adishesha, Vishnu's divine serpent. The temple honours Venkateswara, a manifestation of Vishnu believed to protect humanity during Kali Yuga. Whether the Seven Islands correspond to these hills, and how this relates to Chaya, the disruption and the organisation's survival, remains unresolved."
        ]
      }
    ],
    reply: {
      author: '@csillustrator',
      tag: 'LOG · SYNTHESIS SYNCHRONIZATION COMPLETE',
      body: [
        'INPUT FROM ZD.0001 VERIFIED. DETAIL DENSITY: HIGH. OBSERVER_TRUST_METRIC: INCREASED. ACCESS TIER ELEVATED. RELEASING RESTRICTED ARCHIVE FRAGMENT...',
        'MAINFRAME ARCHIVE UPDATED: The disruptions are attributed to the 7 Floating Islands referenced in regional folklores as the abode of the 9th Avatar of Vishnu in the 28th Mahayuga (REF: SYS2000).',
        '[ERR::0x4F_DATA_CORRUPT] ...The 10th Avatar, ‘Kalki’, arrived at the threshold of Kali Yuga and ▓▓▓▓▓▓ [SECTOR_PURGED // STREAM_FRAGMENTED // 0x99A] ▓▓▓▓▓▓',
        'TRINITY ARCHITECTURE DETECTED: The Protector: Vishnu. The Creator: Brahma. And we have the Destroyer: [ERR::PACKET_CORRUPTED]',
        'ANOMALOUS RESONANCE LOGGED — SUBJECT 04: Her affiliations to the Linga, the Trishul, the Damaru, the Third Eye... [SIGNAL_CORRUPTED]',
        '...The prophecy. The harbinger of destruction.'
      ]
    }
  },
  {
    id: 'ZD.0002', handle: 'poet_on_a_bike', role: 'Observer', clearance: 2, status: 'whitelisted',
    notes: [],
    reply: null
  }
];

var SIGIL = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M20 3 L33 9 V20 C33 28.5 27 34.4 20 37 C13 34.4 7 28.5 7 20 V9 Z"/>' +
  '<path d="M13 20 C15.5 16.2 24.5 16.2 27 20 C24.5 23.8 15.5 23.8 13 20 Z"/>' +
  '<circle cx="20" cy="20" r="2.3" fill="currentColor" stroke="none"/></svg>';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function corrupt(s) {
  return s
    .replace(/(▓+)/g, '<span class="redact">$1</span>')
    .replace(/\[[^\]]*(?:ERR|CORRUPT|PURGED|FRAGMENTED)[^\]]*\]/g, '<span class="err">$&</span>');
}

function paragraphsHtml(paras) {
  var out = '';
  for (var k = 0; k < paras.length; k++) {
    var p = paras[k];
    var text = typeof p === 'string' ? p : p.text;
    var meta = typeof p === 'string' ? '' : p.meta;
    out += '<p>' + corrupt(esc(text)) +
      (meta ? '<span class="note-meta">' + esc(meta) + '</span>' : '') + '</p>';
  }
  return out;
}

function noteInner(note) {
  return '<div class="note-head">' +
      (note.id ? '<span class="note-id">' + esc(note.id) + '</span>' : '') +
      (note.date ? '<span class="note-date">' + esc(note.date) + '</span>' : '') +
      (note.author ? '<span class="note-author">' + esc(note.author) + '</span>' : '') +
      (note.ref ? '<a class="note-ref" href="' + esc(note.ref) + '" target="_blank" rel="noopener">REF ↗</a>' : '') +
    '</div>' +
    (note.tag ? '<div class="note-title">' + esc(note.tag) + '</div>' : '') +
    '<div class="note-body">' + paragraphsHtml(note.body) + '</div>';
}

function notePage(note) {
  if (typeof note === 'string') {
    return '<div class="note">' + corrupt(esc(note)) + '</div>';
  }
  if (note.body == null) {
    return '<div class="note">' + corrupt(esc(note.text)) +
      (note.meta ? '<span class="note-meta">' + esc(note.meta) + '</span>' : '') + '</div>';
  }
  return '<div class="note note-full">' + noteInner(note) + '</div>';
}

function replyHtml(reply) {
  if (!reply) return '';
  if (typeof reply === 'string') {
    return '<div class="mf-reply">' +
      '<div class="mf-head">◈ Mainframe Reply</div>' +
      '<div class="mf-body">' + corrupt(esc(reply)) + '</div></div>';
  }
  return '<div class="mf-reply">' +
    '<div class="mf-head">' +
      '<span class="mf-author">◈ ' + esc(reply.author || 'MAINFRAME') + '</span>' +
      (reply.tag ? '<span class="mf-tag">' + esc(reply.tag) + '</span>' : '') +
    '</div>' +
    '<div class="mf-body">' + paragraphsHtml(reply.body || []) +
      '<p class="eof">[EoF]</p></div></div>';
}

var BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>' +
  '<path d="M4 21.5V5.5"/><path d="M8 7h8"/><path d="M8 11h8"/></svg>';

var nbState = { pages: [], index: 0 };

function buildNotebookPages(o) {
  var notes = o.notes || [];
  var pages = [];
  for (var i = 0; i < notes.length; i++) {
    var inner = notePage(notes[i]);
    if (i === notes.length - 1 && o.reply) inner += replyHtml(o.reply);
    pages.push(inner);
  }
  if (!notes.length && o.reply) pages.push(replyHtml(o.reply));
  for (var b = 0; b < 2; b++) pages.push('');
  return pages;
}

function showPage(i) {
  var pages = document.getElementById('nbPages').children;
  if (i < 0 || i >= pages.length) return;
  nbState.index = i;
  for (var k = 0; k < pages.length; k++) {
    if (k === i) pages[k].removeAttribute('hidden');
    else pages[k].setAttribute('hidden', '');
  }
  document.getElementById('nbIndicator').textContent = (i + 1) + ' / ' + pages.length;
  document.getElementById('nbPrev').disabled = (i === 0);
  document.getElementById('nbNext').disabled = (i === pages.length - 1);
}

function openNotebook(obsIndex) {
  var o = OBSERVERS[obsIndex];
  if (!o) return;
  var pages = buildNotebookPages(o);
  nbState.pages = pages;
  var pagesEl = document.getElementById('nbPages');
  var html = '';
  for (var i = 0; i < pages.length; i++) {
    html += '<div class="nb-page' + (pages[i] ? '' : ' blank') + '">' + pages[i] +
      '<span class="nb-pagenum">' + (i + 1) + ' / ' + pages.length + '</span></div>';
  }
  pagesEl.innerHTML = html;
  pagesEl.scrollTop = 0;
  document.getElementById('nbOwner').textContent = o.id + ' · @' + o.handle;
  showPage(0);
  var overlay = document.getElementById('nbOverlay');
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('nbClose').focus();
}

function closeNotebook() {
  var overlay = document.getElementById('nbOverlay');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

(function wireNotebook() {
  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.obs-notebook-btn') : null;
    if (btn) openNotebook(parseInt(btn.getAttribute('data-nb'), 10));
  });
  document.getElementById('nbClose').addEventListener('click', closeNotebook);
  document.getElementById('nbPrev').addEventListener('click', function () { showPage(nbState.index - 1); });
  document.getElementById('nbNext').addEventListener('click', function () { showPage(nbState.index + 1); });
  document.getElementById('nbOverlay').addEventListener('click', function (e) {
    if (e.target === e.currentTarget) closeNotebook();
  });
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('nbOverlay').classList.contains('open')) return;
    if (e.key === 'Escape') closeNotebook();
    else if (e.key === 'ArrowLeft') showPage(nbState.index - 1);
    else if (e.key === 'ArrowRight') showPage(nbState.index + 1);
  });
})();

function render() {
  var list = document.getElementById('list');
  var frag = document.createDocumentFragment();
  for (var i = 0; i < OBSERVERS.length; i++) {
    var o = OBSERVERS[i];
    var art = document.createElement('article');
    art.className = 'observer';
    art.innerHTML =
      '<div class="sigil">' + SIGIL + '</div>' +
      '<div class="obs-body">' +
        '<div class="obs-id">' + esc(o.id) + '</div>' +
        '<div class="obs-handle">' + esc(o.handle) + '</div>' +
        '<div class="obs-sub">' + esc(o.role || 'Observer') + ' · प्रेक्षक</div>' +
      '</div>' +
      '<div class="obs-tags">' +
        '<span class="badge clear">Clearance · LV ' + esc(o.clearance) + '</span>' +
      '</div>' +
      '<button type="button" class="obs-notebook-btn" data-nb="' + i + '">' +
        '<span class="nb-icon">' + BOOK + '</span>' +
        '<span>Observer Notebook</span>' +
        '<span class="nb-count">' + (o.notes ? o.notes.length : 0) + ' note' +
          ((o.notes && o.notes.length === 1) ? '' : 's') + '</span>' +
      '</button>';
    frag.appendChild(art);
  }
  list.appendChild(frag);
  var n = OBSERVERS.length;
  document.getElementById('count').textContent = n + ' observer' + (n === 1 ? '' : 's');
}

(function buildArt() {
  var NS = 'http://www.w3.org/2000/svg';
  var g = document.getElementById('bgArtG');
  var radii = [70, 140, 215, 295];
  for (var r = 0; r < radii.length; r++) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', radii[r]); c.setAttribute('class', 'y-ring'); g.appendChild(c);
  }
  for (var i = 0; i < 24; i++) {
    var e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('rx', 16); e.setAttribute('ry', 46); e.setAttribute('cy', -250);
    e.setAttribute('class', 'y-petal'); e.setAttribute('transform', 'rotate(' + (i * 15) + ')');
    g.appendChild(e);
  }
  var t1 = document.createElementNS(NS, 'polygon');
  t1.setAttribute('points', '0,-225 195,112 -195,112'); t1.setAttribute('class', 'y-tri');
  var t2 = document.createElementNS(NS, 'polygon');
  t2.setAttribute('points', '0,225 195,-112 -195,-112'); t2.setAttribute('class', 'y-tri');
  g.appendChild(t1); g.appendChild(t2);
})();

render();
</script>
