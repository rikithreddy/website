<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LostArchives · Field Records</title>
<meta name="description" content="LostArchives — a recovered shadow archive. Reference codes, document links, ciphers and passkeys.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --hand: "Caveat", cursive;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --deva: "Noto Sans Devanagari", serif;
    --radius: 9px;
    --radius-lg: 13px;
    --bg: #f4ecda;
    --panel: #ece1c8;
    --panel-2: #e6dabd;
    --sunken: #ded0af;
    --field: #fffaf0;
    --border: #d8c9a8;
    --border-strong: #c6b28a;
    --text: #33261a;
    --muted: #7a6a55;
    --accent: #b4552d;
    --accent-ink: #fff7ee;
    --accent-soft: rgba(180, 85, 45, .12);
    --danger: #b23b2e;
    --shadow: rgba(51, 38, 26, .16);
    --shadow-lg: rgba(51, 38, 26, .28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; flex-direction: column;
    background: var(--bg);
  }

  header, main, footer { position: relative; z-index: 1; }

  header {
    display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 22px;
    background: linear-gradient(180deg, rgba(236,225,200,.85), rgba(222,208,175,.7));
    border-bottom: 1px solid var(--border); box-shadow: 0 1px 3px var(--shadow);
    backdrop-filter: blur(2px);
  }
  .wordmark { font-family: var(--hand); font-weight: 700; font-size: 30px; line-height: 1; color: var(--text); letter-spacing: .5px; }
  .wordmark .accent { color: var(--accent); }
  .devaMark { font-family: var(--deva); font-size: 19px; color: var(--accent); opacity: .75; line-height: 1; }
  .spacer { flex: 1; }

  main { flex: 1; padding: 26px; display: flex; min-height: 0; }
  .card {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: 0 1px 2px var(--shadow), 0 20px 55px var(--shadow-lg);
    position: relative;
  }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: rgba(232, 221, 193, .55);
  }
  .toolbar input[type=search] {
    width: auto; min-width: 180px; flex: 1 1 180px;
    background: var(--field); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 12px; color: var(--text); outline: none;
    font: 12.5px/1.5 var(--sans);
  }
  .toolbar input[type=search]::placeholder { color: var(--muted); opacity: .7; }
  .toolbar input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chips { display: flex; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--panel-2); border-radius: 20px;
    padding: 6px 13px; cursor: pointer; color: var(--muted); font-size: 12px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .scroll { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    font-family: var(--serif); font-weight: 600; text-align: left;
    font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--muted); background: rgba(232, 221, 193, .97);
    border-bottom: 1px solid var(--border-strong); padding: 12px 16px; white-space: nowrap;
    cursor: pointer; user-select: none; transition: color .12s;
  }
  thead th:hover { color: var(--text); }
  .sort-arrow { font-size: 9px; margin-left: 6px; color: var(--accent); }
  tbody td {
    padding: 13px 16px; border-bottom: 1px solid var(--border);
    background: rgba(255, 250, 240, .55); color: var(--text); vertical-align: top;
    overflow-wrap: break-word; word-break: break-word;
  }
  tbody tr:last-child td { border-bottom: 0; }

  td.ref { white-space: nowrap; }
  td.ref .status {
    display: inline-flex; align-items: center; vertical-align: middle;
    font: 600 9px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px; margin-right: 9px;
  }
  td.ref .status.found { color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(180, 85, 45, .25); }
  td.ref .status.lost { color: var(--muted); background: transparent; border: 1px dashed var(--border-strong); }
  td.ref .code { font-family: var(--serif); font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: .02em; }
  tr.lost td.ref .code { color: var(--muted); }

  .badge.lock {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 9px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); border: 1px dashed var(--border-strong); border-radius: 20px;
    padding: 4px 9px; white-space: nowrap;
  }
  .badge.lock svg { flex: none; }

  td.link a { color: var(--accent); text-decoration: none; font-weight: 500; }
  td.link a:hover { text-decoration: underline; }
  td.link a .ext { opacity: .7; margin-left: 3px; }
  td.na { color: var(--muted); }
  td.pass { font-family: var(--sans); font-variant-numeric: tabular-nums; white-space: pre-wrap; line-height: 1.55; }
  td.pass code { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  td.md { line-height: 1.55; }
  td.md div { margin: 0 0 4px; }
  td.md div:last-child { margin-bottom: 0; }
  td.md p { margin: 0 0 6px; }
  td.md p:last-child { margin-bottom: 0; }
  td.md strong, td.md b { color: var(--text); }
  td.md em, td.md i { color: var(--muted); }
  td.md h1, td.md h2, td.md h3, td.md h4 { font-family: var(--serif); font-weight: 600; margin: 0 0 4px; }
  td.md ul, td.md ol { margin: 0 0 6px; padding-left: 18px; }
  td.md blockquote { margin: 0 0 6px; padding-left: 10px; border-left: 3px solid var(--border-strong); color: var(--muted); }
  td.md a { color: var(--accent); }

  tr.lost td { background: rgba(222, 208, 175, .34); }
  tr.lost td.pass code { color: var(--muted); }

  .empty { color: var(--muted); padding: 44px 20px; text-align: center; font-family: var(--serif); font-size: 14px; }
  .empty button { margin-top: 10px; }

  /* loading skeleton */
  .sk-cell, .sk-head {
    border-radius: 6px;
    background: linear-gradient(100deg, var(--panel-2) 30%, var(--panel) 50%, var(--panel-2) 70%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite linear;
  }
  .sk-head { height: 12px; }
  .sk-cell { height: 14px; }
  .sk-cell.w2 { width: 40%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  footer {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    height: 42px; padding: 0 18px;
    border-top: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(236,225,200,.55), rgba(222,208,175,.35));
    color: var(--muted); font-size: 11px;
  }
  footer .fm { font-family: var(--deva); color: rgba(51, 38, 26, .34); font-size: 14px; }
  footer .ft { letter-spacing: .05em; }

  @media (max-width: 720px) {
    header { height: 52px; padding: 0 14px; gap: 8px; }
    .wordmark { font-size: 22px; }
    .devaMark { font-size: 16px; }
    main { padding: 12px; }

    .toolbar { padding: 10px 12px; gap: 8px; }
    .toolbar input[type=search] { flex-basis: 100%; }

    table { min-width: 640px; }
    thead th, tbody td { padding: 10px 12px; }
    td.ref .status { margin-right: 6px; }
  }
  @media (max-width: 400px) {
    .wordmark { font-size: 20px; }
    main { padding: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sk-cell, .sk-head { animation-duration: .001ms; }
  }
</style>
</head>
<body>

<header>
  <span class="wordmark">Lost<span class="accent">Archives</span></span>
  <span class="devaMark">छाया</span>
  <span class="spacer"></span>
</header>

<main>
  <div class="card" id="card">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search records…" aria-label="Search records">
      <div class="chips" id="chips">
        <button type="button" class="chip on" data-status="all">All</button>
        <button type="button" class="chip" data-status="found">Found</button>
        <button type="button" class="chip" data-status="lost">Lost</button>
      </div>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="scroll">
      <table id="archive">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<footer>
  <span class="fm">विस्मृति</span>
  <span class="ft">LostArchives — shadow archive</span>
</footer>

<script>
/* ---------- CSV -> table ---------- */
function parseCSV(text) {
  var rows = [], row = [], field = '', inQ = false, c;
  for (var i = 0; i < text.length; i++) {
    c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function isHtml(v) { return /<[a-zA-Z/][^>]*>/.test(v); }
function html(v) {
  if (!v || !v.trim()) return '';
  if (isHtml(v)) return v;
  return esc(v).replace(/\n/g, '<br>');
}
function textOf(v) {
  return String(v == null ? '' : v).replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
}
function isLost(r) { return !!r[0] && String(r[0]).toUpperCase().trim() === 'LOST'; }
function locked(v) { return String(v).trim() === '[[LOCKED]]'; }

function lockBadge() {
  var b = document.createElement('span');
  b.className = 'badge lock';
  b.innerHTML = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> LOCKED';
  return b;
}

function refCell(r) {
  var td = document.createElement('td');
  td.className = 'ref';
  var pill = document.createElement('span');
  pill.className = 'status ' + (isLost(r) ? 'lost' : 'found');
  pill.textContent = isLost(r) ? 'Lost' : 'Found';
  td.appendChild(pill);
  if (!isLost(r)) {
    var code = document.createElement('span');
    code.className = 'code';
    code.textContent = String(r[0] || '').trim();
    td.appendChild(code);
  }
  return td;
}
function linkCell(v) {
  var td = document.createElement('td');
  td.className = 'link';
  if (locked(v)) { td.appendChild(lockBadge()); return td; }
  if (/^https?:\/\//i.test(v.trim())) {
    var a = document.createElement('a');
    a.href = v.trim(); a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Open record';
    var ext = document.createElement('span');
    ext.className = 'ext'; ext.textContent = '↗';
    a.appendChild(ext);
    td.appendChild(a);
  } else { td.className = 'md'; td.innerHTML = html(v); }
  return td;
}
function naCell() {
  var td = document.createElement('td');
  td.className = 'na'; td.textContent = '—';
  return td;
}
function mdCell(v) {
  var td = document.createElement('td');
  td.className = 'md'; td.innerHTML = html(v);
  return td;
}
function passCell(v) {
  var td = document.createElement('td');
  if (/^\[0x[0-9a-fA-F]+\] not found$/.test(v.trim())) {
    td.className = 'pass';
    var code = document.createElement('code');
    code.textContent = v.trim();
    td.appendChild(code);
  } else { td.className = 'md'; td.innerHTML = html(v); }
  return td;
}
function buildCell(r, j) {
  var v = r[j] != null ? r[j] : '';
  if (j === 0) return refCell(r);
  if (j === 1) return linkCell(v);
  if (j === 2) return v.trim() === 'NA' ? naCell() : mdCell(v);
  return passCell(v);
}

var headers = [], dataRows = [];
var sortCol = 0, sortDir = 1;
var query = '', status = 'all';

function renderHeader() {
  var thead = document.querySelector('#archive thead');
  thead.innerHTML = '';
  var tr = document.createElement('tr');
  headers.forEach(function (h, j) {
    var th = document.createElement('th');
    th.textContent = h;
    th.setAttribute('role', 'columnheader');
    th.addEventListener('click', function () {
      if (sortCol === j) sortDir = -sortDir;
      else { sortCol = j; sortDir = 1; }
      render();
    });
    if (j === sortCol) {
      th.setAttribute('aria-sort', sortDir === 1 ? 'ascending' : 'descending');
      var arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}
function render() {
  renderHeader();
  var tbody = document.querySelector('#archive tbody');
  tbody.innerHTML = '';
  var q = query.trim().toLowerCase();
  var list = dataRows.filter(function (r) {
    if (status === 'found' && isLost(r)) return false;
    if (status === 'lost' && !isLost(r)) return false;
    if (q && r.map(textOf).join(' ').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  if (sortCol >= 0) {
    list.sort(function (a, b) {
      if (sortCol === 0) {
        var al = isLost(a), bl = isLost(b);
        if (al !== bl) return al ? 1 : -1;
      }
      return textOf(a[sortCol]).localeCompare(textOf(b[sortCol]), undefined, { numeric: true }) * sortDir;
    });
  }
  list.forEach(function (r) {
    var tr = document.createElement('tr');
    if (isLost(r)) tr.className = 'lost';
    for (var j = 0; j < headers.length; j++) tr.appendChild(buildCell(r, j));
    tbody.appendChild(tr);
  });
  var n = list.length;
  document.getElementById('count').textContent = n + ' record' + (n === 1 ? '' : 's');
  if (!n) {
    var td = document.createElement('td');
    td.className = 'empty';
    td.colSpan = headers.length;
    var msg = document.createElement('div');
    msg.textContent = 'No records match.';
    td.appendChild(msg);
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'chip';
    btn.textContent = 'Clear filters';
    btn.addEventListener('click', function () {
      query = ''; status = 'all';
      document.getElementById('search').value = '';
      document.querySelectorAll('#chips .chip').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-status') === 'all'); });
      render();
    });
    td.appendChild(btn);
    var tr = document.createElement('tr'); tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

function showSkeleton() {
  var thead = document.querySelector('#archive thead');
  var htr = document.createElement('tr');
  for (var j = 0; j < 5; j++) {
    var th = document.createElement('th');
    var b = document.createElement('div'); b.className = 'sk-head';
    th.appendChild(b); htr.appendChild(th);
  }
  thead.appendChild(htr);
  var tbody = document.querySelector('#archive tbody');
  for (var i = 0; i < 5; i++) {
    var tr = document.createElement('tr');
    for (var k = 0; k < 5; k++) {
      var td = document.createElement('td');
      var c = document.createElement('div'); c.className = 'sk-cell' + (k === 3 ? ' w2' : '');
      td.appendChild(c); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

document.getElementById('search').addEventListener('input', function (e) {
  query = e.target.value; render();
});
document.getElementById('chips').addEventListener('click', function (e) {
  var chip = e.target.closest('.chip');
  if (!chip) return;
  status = chip.getAttribute('data-status');
  document.querySelectorAll('#chips .chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
  render();
});

showSkeleton();
fetch('archive.csv?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(function (text) {
    var rows = parseCSV(text);
    if (!rows.length) throw new Error('empty CSV');
    headers = rows[0];
    dataRows = rows.slice(1);
    render();
  })
  .catch(function (err) {
    document.querySelector('#archive thead').innerHTML = '';
    document.querySelector('#archive tbody').innerHTML =
      '<tr><td class="empty" colspan="5">Could not load archive.csv — ' + esc(String(err)) + '</td></tr>';
  });
</script>
</body>
</html>
