<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LostArchives</title>
<style>
  :root {
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --radius: 9px;
    --radius-lg: 13px;
    --bg: #f4ecda;
    --panel: #ece1c8;
    --panel-2: #e6dabd;
    --sunken: #ded0af;
    --field: #fffaf0;
    --border: #d8c9a8;
    --border-strong: #c6b28a;
    --text: #33261a;
    --muted: #7a6a55;
    --accent: #b4552d;
    --accent-ink: #fff7ee;
    --shadow: rgba(51, 38, 26, .16);
    --shadow-lg: rgba(51, 38, 26, .28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background-image:
      radial-gradient(rgba(120, 90, 50, .04) 1px, transparent 1px),
      radial-gradient(rgba(120, 90, 50, .03) 1px, transparent 1px);
    background-size: 22px 22px, 13px 13px;
    background-position: 0 0, 7px 7px;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 18px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 2px var(--shadow);
  }
  .wordmark { font-family: var(--serif); font-size: 17px; letter-spacing: .02em; }
  .wordmark b { color: var(--accent); font-weight: 700; }
  .spacer { flex: 1; }

  main { flex: 1; padding: 26px; display: flex; min-height: 0; }
  .card {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: 0 1px 2px var(--shadow), 0 18px 48px var(--shadow-lg);
  }
  .scroll { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    font-family: var(--serif); font-weight: 600; text-align: left;
    font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--muted); background: var(--panel-2);
    border-bottom: 1px solid var(--border-strong); padding: 11px 16px; white-space: nowrap;
  }
  tbody td {
    padding: 11px 16px; border-bottom: 1px solid var(--border);
    background: var(--field); color: var(--text); vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.ref { font-family: var(--serif); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.lock { color: var(--muted); font-style: italic; white-space: nowrap; }
  td.link a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--border-strong); }
  td.link a:hover { border-bottom-color: var(--accent); }
  td.na { color: var(--muted); }
  td.pass { font-family: var(--sans); font-variant-numeric: tabular-nums; white-space: pre-wrap; line-height: 1.55; }
  td.pass code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--accent); }
  tr.lost td { background: var(--panel); }
  tr.lost td.ref { color: var(--muted); font-weight: 600; }
  tr.lost td.lock { color: var(--danger); }
  tr.lost td.pass code { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px; text-align: center; font-family: var(--serif); }

  @media (max-width: 640px) {
    main { padding: 14px; }
    thead th, tbody td { padding: 9px 12px; }
  }
</style>
</head>
<body>
<header>
  <span class="wordmark"><b>LostArchives</b></span>
  <span class="spacer"></span>
</header>
<main>
  <div class="card">
    <div class="scroll">
      <table id="archive">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>
<script>
function parseCSV(text) {
  var rows = [], row = [], field = '', inQ = false, c;
  for (var i = 0; i < text.length; i++) {
    c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') { rows.push(row); }
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}

function cell(tag, cls, html) {
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  el.innerHTML = html;
  return el;
}
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function linkCell(url) {
  var td = cell('td', 'link');
  if (/^https?:\/\//i.test(url)) {
    var a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = url;
    td.appendChild(a);
  } else {
    td.textContent = url;
  }
  return td;
}

function passCell(v) {
  var td = cell('td', 'pass');
  if (/^\[0x[0-9a-fA-F]+\] not found$/.test(v.trim())) {
    var code = document.createElement('code');
    code.textContent = v.trim();
    td.appendChild(code);
  } else {
    td.textContent = v;
  }
  return td;
}

function locked(v) { return v.trim() === '[[LOCKED]]'; }

fetch('archive.csv')
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(function (text) {
    var rows = parseCSV(text);
    if (!rows.length) return;
    var header = rows[0];
    var thead = document.querySelector('#archive thead');
    var tr = document.createElement('tr');
    header.forEach(function (h) {
      var th = cell('th', '', esc(h));
      tr.appendChild(th);
    });
    thead.appendChild(tr);

    var tbody = document.querySelector('#archive tbody');
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var rowEl = document.createElement('tr');
      if (r[0] && r[0].toUpperCase() === 'LOST') rowEl.className = 'lost';
      r.forEach(function (v, j) {
        if (j === 0) { rowEl.appendChild(cell('td', 'ref', esc(v))); }
        else if (j === 1) { rowEl.appendChild(linkCell(v)); }
        else if (j === 2) { rowEl.appendChild(cell('td', locked(v) ? 'lock' : '', locked(v) ? esc(v) : esc(v))); }
        else if (j === 3) { rowEl.appendChild(cell('td', v.trim() === 'NA' ? 'na' : '', esc(v))); }
        else { rowEl.appendChild(passCell(v)); }
      });
      tbody.appendChild(rowEl);
    }
  })
  .catch(function (err) {
    document.querySelector('#archive tbody').innerHTML =
      '<tr><td class="empty" colspan="5">Could not load archive.csv — ' + esc(String(err)) + '</td></tr>';
  });
</script>
</body>
</html>
