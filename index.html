<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LostArchives</title>
<style>
  :root {
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --radius: 9px;
    --radius-lg: 13px;
    --bg: #f4ecda;
    --panel: #ece1c8;
    --panel-2: #e6dabd;
    --sunken: #ded0af;
    --field: #fffaf0;
    --border: #d8c9a8;
    --border-strong: #c6b28a;
    --text: #33261a;
    --muted: #7a6a55;
    --accent: #b4552d;
    --accent-ink: #fff7ee;
    --shadow: rgba(51, 38, 26, .16);
    --shadow-lg: rgba(51, 38, 26, .28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background-image:
      radial-gradient(rgba(120, 90, 50, .04) 1px, transparent 1px),
      radial-gradient(rgba(120, 90, 50, .03) 1px, transparent 1px);
    background-size: 22px 22px, 13px 13px;
    background-position: 0 0, 7px 7px;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 18px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 2px var(--shadow);
  }
  .wordmark { font-family: var(--serif); font-size: 17px; letter-spacing: .02em; }
  .wordmark b { color: var(--accent); font-weight: 700; }
  .spacer { flex: 1; }

  main { flex: 1; padding: 26px; display: flex; }
  .card {
    flex: 1; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: 0 1px 2px var(--shadow), 0 18px 48px var(--shadow-lg);
  }
  .card iframe {
    flex: 1; width: 100%; border: 0; display: block;
    background: var(--field); min-height: 70vh;
  }

  @media (max-width: 640px) {
    main { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <span class="wordmark"><b>LostArchives</b></span>
  <span class="spacer"></span>
</header>
<main>
  <div class="card">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTTQaQ9OvcS4Nnu7NKuJqba0coalysYTJP9qVefVyiTsHT_7WJReO66hgjry1ErqyZ5SMNJOIlI8l2S/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
  </div>
</main>
</body>
</html>
