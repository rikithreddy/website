<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LostArchives · Debug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --hand: "Caveat", cursive;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --deva: "Noto Sans Devanagari", serif;
    --radius: 9px;
    --radius-lg: 13px;
    --bg: #f4ecda;
    --panel: #ece1c8;
    --panel-2: #e6dabd;
    --sunken: #ded0af;
    --field: #fffaf0;
    --border: #d8c9a8;
    --border-strong: #c6b28a;
    --text: #33261a;
    --muted: #7a6a55;
    --accent: #b4552d;
    --accent-ink: #fff7ee;
    --ok: #4f7a3a;
    --danger: #b23b2e;
    --shadow: rgba(51, 38, 26, .16);
    --shadow-lg: rgba(51, 38, 26, .28);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    background: linear-gradient(135deg, #f0e6cc 0%, #e7d9b8 48%, #d6c096 100%);
  }
  header {
    display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 22px;
    background: linear-gradient(180deg, rgba(236,225,200,.85), rgba(222,208,175,.72));
    border-bottom: 1px solid var(--border); box-shadow: 0 1px 3px var(--shadow);
    z-index: 5;
  }
  .wordmark { font-family: var(--hand); font-weight: 700; font-size: 30px; line-height: 1; }
  .wordmark .accent { color: var(--accent); }
  .spacer { flex: 1; }
  a.back {
    text-decoration: none; font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px;
  }
  a.back:hover { color: var(--text); border-color: var(--border-strong); }

  main { flex: 1; padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 14px; transition: border-color .12s, background .12s;
  }
  button:hover { border-color: var(--border-strong); background: var(--panel); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }

  .format-bar {
    display: flex; align-items: center; gap: 3px; flex-wrap: wrap;
    background: rgba(230,218,189,.6); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 7px;
  }
  .format-bar button {
    min-width: 28px; padding: 4px 8px; font-size: 12px; border-radius: 6px;
    background: transparent; border: 1px solid transparent; color: var(--text);
  }
  .format-bar button:hover { background: var(--panel); border-color: var(--border); }
  .format-bar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 5px; }
  .format-bar .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-strong); padding: 0; min-width: 0; }
  .format-bar .swatch:hover { transform: scale(1.1); }

  .grid-wrap {
    flex: 1; overflow: auto; min-height: 0;
    background: linear-gradient(180deg, #f2e8d0, #e7d9b8);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 1px 2px var(--shadow), 0 16px 44px var(--shadow-lg);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    font-family: var(--serif); font-weight: 600; text-align: left;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); background: rgba(230,218,189,.98);
    border-bottom: 1px solid var(--border-strong); padding: 11px 14px; white-space: nowrap;
  }
  th.del { width: 40px; }
  tbody td {
    padding: 6px 8px; border-bottom: 1px solid var(--border);
    background: rgba(255,250,240,.72); vertical-align: top; min-width: 140px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td[contenteditable] { outline: none; min-height: 32px; }
  td[contenteditable]:hover { background: rgba(255,250,240,.9); }
  td[contenteditable]:focus { background: var(--field); box-shadow: inset 0 0 0 2px var(--accent); border-radius: 4px; }
  td.c-ref { font-family: var(--hand); font-weight: 700; font-size: 16px; color: var(--accent); white-space: nowrap; }
  td.c-link a { color: var(--accent); }
  td.c-mono { font-family: var(--mono); font-size: 11px; }
  tr.lost td { background: rgba(222,208,175,.4); }
  tr.lost td.c-ref { color: var(--muted); }
  .row-del { border: none; background: transparent; color: var(--muted); padding: 2px 8px; font-size: 15px; line-height: 1; }
  .row-del:hover { color: var(--danger); background: transparent; }

  @media (max-width: 820px) {
    header { height: 52px; padding: 0 14px; }
    .wordmark { font-size: 22px; }
    main { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <span class="wordmark">Lost<span class="accent">Archives</span></span>
  <span class="spacer"></span>
  <a class="back" href="/">View site</a>
</header>

<main>
  <div class="bar">
    <button type="button" id="save" class="btn-primary">Save CSV</button>
    <button type="button" id="reload">Reload</button>
    <button type="button" id="addRow">+ Row</button>
    <button type="button" id="download">Download</button>
    <span class="status" id="status"></span>
  </div>

  <div class="format-bar" id="formatBar">
    <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
    <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
    <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
    <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
    <button type="button" data-cmd="heading" title="Heading">H</button>
    <span class="sep"></span>
    <button type="button" data-cmd="createLink" title="Link">🔗</button>
    <button type="button" data-cmd="insertUnorderedList" title="Bullet list">•</button>
    <button type="button" data-cmd="insertOrderedList" title="Numbered list">1.</button>
    <span class="sep"></span>
    <button type="button" data-cmd="justifyLeft" title="Align left">⯇</button>
    <button type="button" data-cmd="justifyCenter" title="Align center">⯇⯈</button>
    <button type="button" data-cmd="justifyRight" title="Align right">⯈</button>
    <span class="sep"></span>
    <button type="button" class="swatch" data-color="#b4552d" style="background:#b4552d" title="Accent"></button>
    <button type="button" class="swatch" data-color="#4f7a3a" style="background:#4f7a3a" title="Green"></button>
    <button type="button" class="swatch" data-color="#b23b2e" style="background:#b23b2e" title="Red"></button>
    <button type="button" class="swatch" data-color="#7a6a55" style="background:#7a6a55" title="Muted"></button>
    <button type="button" class="swatch" data-color="#2b5d8a" style="background:#2b5d8a" title="Blue"></button>
    <button type="button" class="swatch" data-color="#33261a" style="background:#33261a" title="Ink"></button>
    <span class="sep"></span>
    <button type="button" data-cmd="removeFormat" title="Clear formatting">⌫</button>
  </div>

  <div class="grid-wrap">
    <table id="grid">
      <thead><tr><th class="del"></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
var COLUMNS = ['REFERENCE_CODE', 'DOCUMENT_LINK', 'CIPHER_DECRYPTED', 'ENCRYPTION_DETAILS', 'PASSKEY'];

function parseCSV(text) {
  var rows = [], row = [], field = '', inQ = false, c;
  for (var i = 0; i < text.length; i++) {
    c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function isHtml(v) { return /<[a-zA-Z/][^>]*>/.test(v); }

var statusEl = document.getElementById('status');
function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

var grid = document.getElementById('grid');

function cellClasses(j) {
  if (j === 0) return 'c-ref';
  if (j === 1) return 'c-link';
  return '';
}
function setCell(td, v) {
  if (isHtml(v)) td.innerHTML = v;
  else td.innerHTML = esc(v).replace(/\n/g, '<br>');
}
function newRow(values) {
  var tr = document.createElement('tr');
  if (values && values[0] && String(values[0]).toUpperCase() === 'LOST') tr.className = 'lost';

  var del = document.createElement('td');
  del.className = 'del';
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'row-del'; btn.title = 'Delete row'; btn.textContent = '✕';
  btn.addEventListener('click', function () { tr.remove(); });
  del.appendChild(btn);
  tr.appendChild(del);

  for (var j = 0; j < COLUMNS.length; j++) {
    var td = document.createElement('td');
    td.contentEditable = 'true';
    td.setAttribute('data-col', j);
    td.className = cellClasses(j);
    setCell(td, (values && values[j] != null) ? values[j] : '');
    tr.appendChild(td);
  }
  return tr;
}

function render(rows) {
  var thead = grid.querySelector('thead tr');
  COLUMNS.forEach(function (h) {
    var th = document.createElement('th');
    th.textContent = h;
    thead.appendChild(th);
  });
  var tbody = grid.querySelector('tbody');
  tbody.innerHTML = '';
  var data = rows.slice(1);
  data.forEach(function (r) { tbody.appendChild(newRow(r)); });
}

function load() {
  fetch('/api/archive')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      var rows = parseCSV(d.csv);
      if (!rows.length) return;
      grid.querySelector('thead tr').innerHTML = '<th class="del"></th>';
      render(rows);
      setStatus('loaded', 'ok');
    })
    .catch(function (e) { setStatus('load failed: ' + e.message, 'err'); });
}

function csvField(v) {
  v = String(v == null ? '' : v);
  if (/[",\n\r]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function collectCSV() {
  var lines = [COLUMNS.join(',')];
  grid.querySelectorAll('tbody tr').forEach(function (tr) {
    var vals = [];
    tr.querySelectorAll('td[data-col]').forEach(function (td) { vals.push(td.innerHTML.trim()); });
    lines.push(vals.map(csvField).join(','));
  });
  return lines.join('\n') + '\n';
}

document.getElementById('save').addEventListener('click', function () {
  setStatus('saving…', '');
  fetch('/api/archive', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ csv: collectCSV() })
  })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (res.ok) setStatus('saved', 'ok');
      else setStatus('save failed: ' + (res.d.error || 'unknown'), 'err');
    })
    .catch(function (e) { setStatus('save failed: ' + e.message, 'err'); });
});
document.getElementById('reload').addEventListener('click', load);
document.getElementById('addRow').addEventListener('click', function () {
  grid.querySelector('tbody').appendChild(newRow(['LOST', '[[LOCKED]]', 'NA', 'NA', '']));
  setStatus('row added (unsaved)', '');
});
document.getElementById('download').addEventListener('click', function () {
  var blob = new Blob([collectCSV()], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'archive.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ---------- formatting toolbar (WYSIWYG) ---------- */
document.execCommand('styleWithCSS', false, true);

document.getElementById('formatBar').addEventListener('mousedown', function (ev) {
  if (ev.target.closest('button')) ev.preventDefault();
});
document.getElementById('formatBar').addEventListener('click', function (ev) {
  var btn = ev.target.closest('button');
  if (!btn) return;
  var color = btn.getAttribute('data-color');
  if (color) { document.execCommand('foreColor', false, color); return; }
  var cmd = btn.getAttribute('data-cmd');
  if (!cmd) return;
  if (cmd === 'heading') { document.execCommand('formatBlock', false, 'H2'); return; }
  if (cmd === 'createLink') {
    var url = prompt('URL', 'https://');
    if (url) document.execCommand('createLink', false, url);
    return;
  }
  document.execCommand(cmd, false, null);
});

load();
</script>
</body>
</html>
