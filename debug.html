<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LostArchives · Debug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --hand: "Caveat", cursive;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --deva: "Noto Sans Devanagari", serif;
    --radius: 9px;
    --radius-lg: 13px;
    --bg: #f4ecda;
    --panel: #ece1c8;
    --panel-2: #e6dabd;
    --sunken: #ded0af;
    --field: #fffaf0;
    --border: #d8c9a8;
    --border-strong: #c6b28a;
    --text: #33261a;
    --muted: #7a6a55;
    --accent: #b4552d;
    --accent-ink: #fff7ee;
    --ok: #4f7a3a;
    --danger: #b23b2e;
    --shadow: rgba(51, 38, 26, .16);
    --shadow-lg: rgba(51, 38, 26, .28);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    background: linear-gradient(135deg, #f0e6cc 0%, #e7d9b8 48%, #d6c096 100%);
  }
  header {
    display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 22px;
    background: linear-gradient(180deg, rgba(236,225,200,.85), rgba(222,208,175,.72));
    border-bottom: 1px solid var(--border); box-shadow: 0 1px 3px var(--shadow);
  }
  .wordmark { font-family: var(--hand); font-weight: 700; font-size: 30px; line-height: 1; }
  .wordmark .accent { color: var(--accent); }
  .spacer { flex: 1; }
  a.back {
    text-decoration: none; font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px;
  }
  a.back:hover { color: var(--text); border-color: var(--border-strong); }

  main { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 16px; transition: border-color .12s, background .12s;
  }
  button:hover { border-color: var(--border-strong); background: var(--panel); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }

  .split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
  .card {
    display: flex; flex-direction: column; min-width: 0;
    background: linear-gradient(180deg, #f2e8d0, #e7d9b8);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 1px 2px var(--shadow), 0 16px 44px var(--shadow-lg);
    overflow: hidden;
  }
  .card h2 {
    font-family: var(--serif); font-weight: 600; font-size: 12px; margin: 0;
    letter-spacing: .13em; text-transform: uppercase; color: var(--muted);
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(230,218,189,.9);
  }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; padding: 14px 16px;
    background: rgba(255,250,240,.72); color: var(--text);
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
  }
  .scroll { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    font-family: var(--serif); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); background: rgba(230,218,189,.96); text-align: left;
    border-bottom: 1px solid var(--border-strong); padding: 10px 14px; white-space: nowrap;
  }
  tbody td {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: rgba(255,250,240,.62); vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.ref { font-family: var(--hand); font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
  td code { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  tr.lost td.ref { color: var(--muted); }

  /* formatting toolbar */
  .format-bar {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    background: rgba(230,218,189,.6); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px 8px;
  }
  .format-bar button {
    min-width: 30px; padding: 4px 9px; font-size: 12px; border-radius: 6px;
    background: transparent; border: 1px solid transparent; color: var(--text);
  }
  .format-bar button:hover { background: var(--panel); border-color: var(--border); }
  .format-bar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
  .format-bar .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-strong); padding: 0; min-width: 0; }
  .format-bar .swatch:hover { transform: scale(1.1); }

  /* markdown-rendered cell content */
  .md p { margin: 0 0 6px; }
  .md p:last-child { margin-bottom: 0; }
  .md strong { color: var(--text); }
  .md em { color: var(--muted); }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--serif); font-weight: 600; margin: 0 0 4px; }
  .md ul, .md ol { margin: 0 0 6px; padding-left: 18px; }
  .md blockquote { margin: 0 0 6px; padding-left: 10px; border-left: 3px solid var(--border-strong); color: var(--muted); }
  .md a { color: var(--accent); }

  @media (max-width: 820px) {
    .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    header { height: 52px; padding: 0 14px; }
    .wordmark { font-size: 22px; }
    main { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <span class="wordmark">Lost<span class="accent">Archives</span></span>
  <span class="spacer"></span>
  <a class="back" href="/">View site</a>
</header>

<main>
  <div class="toolbar">
    <button type="button" id="save" class="btn-primary">Save CSV</button>
    <button type="button" id="reload">Reload</button>
    <button type="button" id="download">Download</button>
    <span class="status" id="status"></span>
  </div>

  <div class="format-bar" id="formatBar">
    <button type="button" data-md="bold" title="Bold"><b>B</b></button>
    <button type="button" data-md="italic" title="Italic"><i>I</i></button>
    <button type="button" data-md="strike" title="Strikethrough"><s>S</s></button>
    <button type="button" data-md="code" title="Inline code">&lt;/&gt;</button>
    <button type="button" data-md="heading" title="Heading">H</button>
    <span class="sep"></span>
    <button type="button" data-md="link" title="Link">🔗</button>
    <button type="button" data-md="quote" title="Quote">“</button>
    <button type="button" data-md="ul" title="Bullet list">•</button>
    <button type="button" data-md="ol" title="Numbered list">1.</button>
    <span class="sep"></span>
    <button type="button" data-md="align-left" title="Align left">⯇</button>
    <button type="button" data-md="align-center" title="Align center">⯇⯈</button>
    <button type="button" data-md="align-right" title="Align right">⯈</button>
    <span class="sep"></span>
    <button type="button" class="swatch" data-color="#b4552d" style="background:#b4552d" title="Accent"></button>
    <button type="button" class="swatch" data-color="#4f7a3a" style="background:#4f7a3a" title="Green"></button>
    <button type="button" class="swatch" data-color="#b23b2e" style="background:#b23b2e" title="Red"></button>
    <button type="button" class="swatch" data-color="#7a6a55" style="background:#7a6a55" title="Muted"></button>
    <button type="button" class="swatch" data-color="#2b5d8a" style="background:#2b5d8a" title="Blue"></button>
    <button type="button" class="swatch" data-color="#33261a" style="background:#33261a" title="Ink"></button>
  </div>

  <div class="split">
    <div class="card">
      <h2>archive.csv</h2>
      <textarea id="editor" spellcheck="false" placeholder="Loading…"></textarea>
    </div>
    <div class="card">
      <h2>Preview</h2>
      <div class="scroll">
        <table id="preview"><thead></thead><tbody></tbody></table>
      </div>
    </div>
  </div>
</main>

<script>
function parseCSV(text) {
  var rows = [], row = [], field = '', inQ = false, c;
  for (var i = 0; i < text.length; i++) {
    c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function md(s) {
  if (!s || !s.trim()) return '';
  if (window.marked) return window.marked.parse(s, { breaks: true });
  return esc(s).replace(/\n/g, '<br>');
}

var statusEl = document.getElementById('status');
function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

function renderPreview() {
  var rows = parseCSV(document.getElementById('editor').value);
  var thead = document.querySelector('#preview thead');
  var tbody = document.querySelector('#preview tbody');
  thead.innerHTML = ''; tbody.innerHTML = '';
  if (!rows.length) return;
  var tr = document.createElement('tr');
  rows[0].forEach(function (h) {
    var th = document.createElement('th'); th.textContent = h; tr.appendChild(th);
  });
  thead.appendChild(tr);
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i], rowEl = document.createElement('tr');
    if (r[0] && r[0].toUpperCase() === 'LOST') rowEl.className = 'lost';
    r.forEach(function (v, j) {
      var td = document.createElement('td');
      if (j === 0) { td.className = 'ref'; td.textContent = v; }
      else if (/^\[0x[0-9a-fA-F]+\]/.test(v.trim())) {
        var code = document.createElement('code'); code.textContent = v.trim(); td.appendChild(code);
      } else { td.className = 'md'; td.innerHTML = md(v); }
      rowEl.appendChild(td);
    });
    tbody.appendChild(rowEl);
  }
  setStatus(rows.length + ' rows', '');
}

function load() {
  fetch('/api/archive')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      document.getElementById('editor').value = d.csv;
      renderPreview();
      setStatus('loaded', 'ok');
    })
    .catch(function (e) { setStatus('load failed: ' + e.message, 'err'); });
}

document.getElementById('save').addEventListener('click', function () {
  setStatus('saving…', '');
  fetch('/api/archive', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ csv: document.getElementById('editor').value })
  })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (res.ok) { renderPreview(); setStatus('saved', 'ok'); }
      else setStatus('save failed: ' + (res.d.error || 'unknown'), 'err');
    })
    .catch(function (e) { setStatus('save failed: ' + e.message, 'err'); });
});

document.getElementById('reload').addEventListener('click', load);
document.getElementById('download').addEventListener('click', function () {
  var blob = new Blob([document.getElementById('editor').value], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'archive.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

var t;
document.getElementById('editor').addEventListener('input', function () {
  clearTimeout(t);
  t = setTimeout(renderPreview, 250);
});

/* ---------- formatting toolbar ---------- */
var editor = document.getElementById('editor');

function surround(before, after, placeholder) {
  var s = editor.selectionStart, e = editor.selectionEnd;
  var sel = editor.value.slice(s, e) || placeholder || '';
  editor.setRangeText(before + sel + after, s, e, 'end');
  editor.focus();
  renderPreview();
}
function eachLine(fn) {
  var s = editor.selectionStart, e = editor.selectionEnd;
  var text = editor.value;
  var start = text.lastIndexOf('\n', s - 1) + 1;
  var end = text.indexOf('\n', e);
  if (end < 0) end = text.length;
  var lines = text.slice(start, end).split('\n');
  editor.setRangeText(lines.map(fn).join('\n'), start, end, 'end');
  editor.focus();
  renderPreview();
}

var actions = {
  bold: function () { surround('**', '**', 'bold'); },
  italic: function () { surround('*', '*', 'italic'); },
  strike: function () { surround('~~', '~~', 'strike'); },
  code: function () { surround('`', '`', 'code'); },
  heading: function () { eachLine(function (l) { return '## ' + l.replace(/^#+\s*/, ''); }); },
  link: function () { surround('[', '](https://)', 'label'); },
  quote: function () { eachLine(function (l) { return '> ' + l; }); },
  ul: function () { eachLine(function (l) { return '- ' + l.replace(/^[-*]\s*/, ''); }); },
  ol: function () {
    var i = 0;
    eachLine(function (l) { i++; return i + '. ' + l.replace(/^\d+\.\s*/, ''); });
  },
  'align-left': function () { surround('<p align="left">', '</p>', 'text'); },
  'align-center': function () { surround('<p align="center">', '</p>', 'text'); },
  'align-right': function () { surround('<p align="right">', '</p>', 'text'); }
};

document.getElementById('formatBar').addEventListener('click', function (ev) {
  var btn = ev.target.closest('button');
  if (!btn) return;
  var color = btn.getAttribute('data-color');
  if (color) { surround('<span style="color:' + color + '">', '</span>', 'text'); return; }
  var act = btn.getAttribute('data-md');
  if (act && actions[act]) actions[act]();
});

load();
</script>
</body>
</html>
